# Feature List
features                                  :

  - title                                 : Slide to the Exit
    description                           : One swipe, and the chameleon slides until something stops it. Plan every move.
    fontawesome_icon_name                 : arrows-alt

  - title                                 : Change Color, Open the Way
    description                           : Step in a puddle to take its color. Only the doors of your color let you through.
    fontawesome_icon_name                 : palette

  - title                                 : 100 Levels in 5 Packs
    description                           : From a neon jungle to a volcano, each pack has its arcade look and its new pieces.
    fontawesome_icon_name                 : layer-group

  - title                                 : Traps That Move
    description                           : Skulls, fireballs, snakes, spotlights, vines and a dragon, all in real time.
    fontawesome_icon_name                 : dragon

  - title                                 : Three Stars per Level
    description                           : Collect every star on your way, then go for the best score.
    fontawesome_icon_name                 : star

  - title                                 : Free to Play
    description                           : No account. Remove the ads with a one-time purchase.
    fontawesome_icon_name                 : unlock



